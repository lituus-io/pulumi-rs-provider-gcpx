name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install critcmp
        uses: taiki-e/install-action@v2
        with:
          tool: critcmp

      # The baseline is the merge-base, measured on this same runner. Comparing
      # against a stored absolute number would just measure runner variance.
      - name: Measure baseline (merge-base)
        if: github.event_name == 'pull_request'
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          cargo bench --workspace --locked -- --save-baseline base
          git checkout --force ${{ github.sha }}

      - name: Measure current
        run: cargo bench --workspace --locked -- --save-baseline current

      - name: Compare and gate
        if: github.event_name == 'pull_request'
        run: |
          critcmp base current | tee bench-compare.txt
          # Fail on any benchmark more than 10% slower than the merge-base.
          if critcmp base current --threshold 10 | grep -q 'current'; then
            echo "::error::benchmark regression >10% against merge-base"
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-compare.txt
            target/criterion/

  allocations:
    name: Allocation ceilings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Wall-clock benchmarks are noisy on shared runners; allocation counts are
      # deterministic, so memory growth is gated here rather than in criterion.
      #
      # The feature installs a counting global allocator, which is why it is not
      # on by default: every other test binary in the workspace would inherit
      # it. The counter is process-wide, so the suite is one sequential test.
      - run: |
          cargo test --locked -p gcpx-live-tests \
            --features alloc-ceilings --test alloc_ceilings -- --nocapture
