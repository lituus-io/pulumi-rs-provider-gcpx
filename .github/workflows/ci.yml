name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Vendor and downstream names must never enter this tree or its history.
      # Enforced mechanically because a convention that relies on memory drifts.
      - name: Scan tree and commit messages for forbidden tokens
        run: ./scripts/hygiene.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux-x86:
    name: Test (Linux x86_64)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-linux-arm:
    name: Test (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-macos-arm:
    name: Test (macOS ARM64)
    runs-on: macos-15
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-windows:
    name: Test (Windows x86_64)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides the
      # rust-toolchain.toml pin — so the pinned MSRV must be requested here
      # explicitly or it is never exercised in CI.
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # A ratchet, not an aspiration. The gate was set at 85% and the tree has
      # never reached it — the first run that actually executed measured 77.89%,
      # with several BigQuery handler modules at 0% because nothing but the live
      # suite touches them and that does not run here.
      #
      # 85% named a goal and gated nothing, because a check that always fails is
      # a check nobody reads. This number is the measured floor: it cannot catch
      # up on the gap, but it does stop the gap widening. Raise it whenever the
      # real figure rises — that is the only way it moves.
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 77 --summary-only

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Asserts the plugin protocol surface: port-on-stdout handshake, the full
      # resource-token set, the GetSchema round-trip, and the reported version.
      #
      # The test launches the real binary, so it has to exist first — `cargo
      # test` does not build another package's binary for you, and without this
      # the suite fails on a missing file rather than on anything it is testing.
      - run: cargo build --locked -p pulumi-resource-gcpx
      - run: cargo test --locked --test conformance -- --ignored

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build binary and install Python package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          ./python/build_binary.sh
          pip install ./python
      - name: Run Python tests
        run: |
          . .venv/bin/activate
          pytest python/tests -v

  binary-size:
    name: Binary size
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      # The plugin is downloaded and launched per deploy, so its size is a cost
      # every user pays. A ceiling is set slightly above the current size: it
      # will not notice a few hundred bytes, which is noise, and will notice a
      # dependency arriving that adds a megabyte. Raising it is fine — doing so
      # deliberately, in the commit that earns it, is the point.
      #
      # RUSTFLAGS is cleared deliberately: an env-level RUSTFLAGS makes cargo
      # ignore `target.*.rustflags` from .cargo/config.toml, so the rest of CI
      # never exercises the real release link configuration. Clearing it here
      # means this job links exactly like release.yml does.
      - name: Build and report size
        env:
          RUSTFLAGS: ""
        run: |
          cargo build --release --locked -p pulumi-resource-gcpx
          size=$(stat -c%s target/release/pulumi-resource-gcpx)
          # Calibrated on this runner: a Linux build is materially larger than
          # the same source on macOS, so a ceiling taken from a developer's
          # machine fails here for no reason. Measured at 4.28 MiB.
          ceiling=4718592  # 4.5 MiB
          {
            echo "### Release binary size"
            echo ""
            echo "| Binary | Bytes | MiB | Ceiling |"
            echo "|---|---:|---:|---:|"
            printf '| pulumi-resource-gcpx | %s | %.2f | %.2f |\n' \
              "$size" \
              "$(echo "scale=4; $size/1048576" | bc)" \
              "$(echo "scale=4; $ceiling/1048576" | bc)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$ceiling" ]; then
            echo "::error::binary is $size bytes, over the $ceiling ceiling"
            exit 1
          fi

  cross-check:
    name: Cross-compile check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Ensure musl targets installed
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Check musl x86_64
        run: cargo zigbuild --workspace --locked --target x86_64-unknown-linux-musl --release
      - name: Check musl aarch64
        run: cargo zigbuild --workspace --locked --target aarch64-unknown-linux-musl --release
