[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
authors = ["terekete <spicyzhug@gmail.com>"]
repository = "https://github.com/lituus-io/pulumi-rs-provider-gcpx"

[package]
name = "gcpx-live-tests"
description = "Live GCP integration tests for the gcpx provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

autotests = false

[[test]]
name = "gcp_live_scheduled"
path = "tests/gcp_live_scheduled.rs"

[features]
# Installs a counting global allocator, so it must not be on for ordinary test
# runs — every other test binary in the workspace would inherit it.
alloc-ceilings = []

[[test]]
name = "alloc_ceilings"
path = "tests/alloc_ceilings.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = true

[[test]]
name = "security"
path = "tests/security.rs"

[[test]]
name = "gcp_live"
path = "tests/gcp_live.rs"

[[test]]
name = "gcp_live_agents"
path = "tests/gcp_live_agents.rs"

[dev-dependencies]
gcpx-core = { workspace = true }
gcpx-bq = { workspace = true }
gcpx-dbt = { workspace = true }
gcpx-provider = { workspace = true }
gcpx-agents = { workspace = true }
gcpx-snapshot = { workspace = true }
gcpx-scheduler = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
futures-util = { workspace = true }
# The conformance test speaks gRPC to the plugin binary the way the engine does.
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/pulumi-resource-gcpx",
    "crates/gcpx-provider",
    "crates/gcpx-agents",
    "crates/gcpx-snapshot",
    "crates/gcpx-dataproc",
    "crates/gcpx-dbt",
    "crates/gcpx-scheduler",
    "crates/gcpx-bq",
    "crates/gcpx-core",
]

[workspace.dependencies]
# In-workspace crates
gcpx-core = { path = "crates/gcpx-core", version = "0.1.0" }
gcpx-bq = { path = "crates/gcpx-bq", version = "0.1.0" }
gcpx-scheduler = { path = "crates/gcpx-scheduler", version = "0.1.0" }
gcpx-dbt = { path = "crates/gcpx-dbt", version = "0.1.0" }
gcpx-snapshot = { path = "crates/gcpx-snapshot", version = "0.1.0" }
gcpx-dataproc = { path = "crates/gcpx-dataproc", version = "0.1.0" }
gcpx-agents = { path = "crates/gcpx-agents", version = "0.1.0" }
gcpx-provider = { path = "crates/gcpx-provider", version = "0.1.0" }

# Pulumi protocol. Pinned to a tag rather than a sibling path checkout so the
# build is reproducible and CI needs no checkout-and-symlink step.
pulumi-rs-yaml-proto = { git = "https://github.com/lituus-io/pulumi-rs-yaml.git", tag = "v0.5.22" }

# gRPC / protobuf — versions match pulumi-rs-yaml v0.5.22 so the shared
# pulumirpc types resolve to a single copy in the dependency graph.
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime. No `signal`: the plugin's lifetime is owned by the engine.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP. rustls-tls keeps fully static musl builds free of OpenSSL.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "http2"], default-features = false }

# Errors — never anyhow, which boxes into `dyn Error`.
thiserror = "2"

# Primitives
memchr = "2"
base64 = "0.22"
bytes = "1"
mimalloc = { version = "0.1", default-features = false }

# Dev
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json", "redactions"] }
wiremock = "0.6"
scopeguard = "1"
dhat = "0.3"

# Size is the goal for the bulk of the binary: this is a plugin the CLI
# downloads and launches per deploy, and almost all of its code — TLS, HTTP/2,
# gRPC, the proto types — runs once per request and is nowhere near a hot loop.
# `opt-level = "z"` across that bulk takes roughly a third off the binary.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
overflow-checks = false

# The exception, and the reason this is a per-package override rather than a
# blanket setting: the dbt template pipeline is the one measured hot path. It
# scans and rewrites SQL once per model per deploy, and a stack can hold
# hundreds. Compiled for size it runs about three times slower — scanning drops
# from ~1.4 GiB/s to ~0.5 — while saving only tens of kilobytes. That is the
# wrong trade in both directions, so these two stay at full optimisation.
[profile.release.package.gcpx-dbt]
opt-level = 3

[profile.release.package.gcpx-core]
opt-level = 3

# Benchmarks keep symbols so profilers can attribute samples. Cargo already
# forces unwind here regardless of the release profile's `panic = "abort"`.
[profile.bench]
inherits = "release"
debug = 1
strip = "none"
