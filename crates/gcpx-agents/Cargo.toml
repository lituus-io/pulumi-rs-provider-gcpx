[package]
name = "gcpx-agents"
description = "Conversational Analytics data agents and Vertex AI agent engines for the gcpx Pulumi provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
mock = ["gcpx-bq/mock"]

[dependencies]
gcpx-core = { workspace = true }
gcpx-bq = { workspace = true }
gcpx-dbt = { workspace = true }
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
gcpx-agents = { path = ".", features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
