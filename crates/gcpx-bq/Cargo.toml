[package]
name = "gcpx-bq"
description = "BigQuery resources for the gcpx Pulumi provider: schema evolution, tables, datasets, routines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The double is a library item, not a test item: a `cfg(test)` mock is invisible
# to every other crate, which is why the predecessor could not share one.
mock = ["dep:thiserror"]

[dependencies]
gcpx-core = { workspace = true }
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
gcpx-bq = { path = ".", features = ["mock"] }
pulumi-rs-yaml-proto = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
proptest = { workspace = true }
