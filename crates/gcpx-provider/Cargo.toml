[package]
name = "gcpx-provider"
description = "Pulumi ResourceProvider implementation and schema for the gcpx provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
mock = ["gcpx-bq/mock", "gcpx-scheduler/mock", "gcpx-dbt/mock", "gcpx-snapshot/mock", "gcpx-dataproc/mock", "gcpx-agents/mock"]

[dependencies]
gcpx-core = { workspace = true }
gcpx-bq = { workspace = true }
gcpx-dbt = { workspace = true }
gcpx-scheduler = { workspace = true }
gcpx-snapshot = { workspace = true }
gcpx-dataproc = { workspace = true }
gcpx-agents = { workspace = true }
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gcpx-provider = { path = ".", features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
