[package]
name = "gcpx-scheduler"
description = "Cloud Workflows and Cloud Scheduler orchestration for the gcpx Pulumi provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
mock = ["gcpx-bq/mock", "dep:thiserror"]

[dependencies]
gcpx-core = { workspace = true }
gcpx-bq = { workspace = true }
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
gcpx-scheduler = { path = ".", features = ["mock"] }
pulumi-rs-yaml-proto = { workspace = true }
prost-types = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
proptest = { workspace = true }
