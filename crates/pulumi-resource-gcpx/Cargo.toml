[package]
name = "pulumi-resource-gcpx"
description = "Pulumi plugin binary for the gcpx provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The filename is fixed by Pulumi's plugin loader, which resolves a provider by
# looking for `pulumi-resource-<package>` on PATH. It is not a naming choice.
[[bin]]
name = "pulumi-resource-gcpx"
path = "src/main.rs"

[dependencies]
gcpx-core = { workspace = true }
gcpx-provider = { workspace = true }
pulumi-rs-yaml-proto = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { workspace = true }
mimalloc = { workspace = true }
